name: CUDA tests
on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --locked --extra gpu --group dev
      - name: Require the CUDA extension and GPU
        run: uv run --no-sync python -c "import rcabeam._cuda_impl, cupy; assert cupy.cuda.runtime.getDeviceCount() > 0"
      - run: uv run --no-sync pytest -q
