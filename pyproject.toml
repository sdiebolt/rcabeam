[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=3.0.1,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "rcabeam"
version = "0.1.0"
description = "Experimental row-column-array ultrasound beamforming kernels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "napari[all]>=0.9.2",
    "numpy>=2.0",
    "rich>=14.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda13x>=14"]
matrix = [
    "cupy-cuda13x>=14",
    "mach-beamform>=0.2.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "ty>=0.0.49", "scikit-build-core>=0.10", "nanobind>=3.0.1,<4", "cmake>=3.26", "ninja>=1.11"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/rcabeam"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "examples/reference_rca_beamformers.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]
